<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BiblioFlow order management – search, filter, sort and export 260 customer orders with full order details.">
  <meta name="author" content="BiblioFlow">
  <meta name="keywords" content="orders, order management, customers, payments, shipping status, bookstore">
  <meta name="theme-color" content="#3f2a1d">
  <title>Orders | BiblioFlow</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="js/auth.js"></script>
  <script>BFAuth.require();</script>
</head>
<body data-page="orders">
  <div id="app-navbar"></div>

  <main class="container-xxl py-4">
    <header class="page-head mb-4 fade-up d-flex flex-wrap justify-content-between align-items-end gap-2">
      <div>
        <div class="breadcrumb-lite mb-1"><i class="bi bi-house"></i> Home / Orders</div>
        <h1>Customer Orders</h1>
        <p>Track every order from pending to completed.</p>
      </div>
      <button class="btn btn-gold rounded-pill" id="btnExport" type="button"><i class="bi bi-download me-2"></i>Export CSV</button>
    </header>

    <!-- Charts -->
    <section class="row g-3 mb-4" aria-label="Order charts">
      <div class="col-lg-5 fade-up">
        <article class="bf-card p-3 p-md-4 h-100">
          <div class="mb-3"><h2 class="section-title">Order Status</h2><p class="section-sub">All orders by current status</p></div>
          <div class="chart-box sm"><canvas id="chartOrdStatus" aria-label="Order status doughnut chart"></canvas></div>
        </article>
      </div>
      <div class="col-lg-7 fade-up" style="--d:.1s">
        <article class="bf-card p-3 p-md-4 h-100">
          <div class="mb-3"><h2 class="section-title">Basket Size</h2><p class="section-sub">How many different books customers buy per order</p></div>
          <div class="chart-box sm"><canvas id="chartBasket" aria-label="Basket size chart"></canvas></div>
        </article>
      </div>
    </section>

    <!-- Status tabs + filters -->
    <section class="bf-card p-3 mb-3 fade-up" aria-label="Order filters">
      <div class="status-tabs mb-3" id="statusTabs" role="tablist"></div>
      <div class="row g-2 align-items-end">
        <div class="col-12 col-lg-4">
          <label for="q" class="form-label small mb-1">Search</label>
          <div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input id="q" type="search" class="form-control" placeholder="Order ID, customer or email"></div>
        </div>
        <div class="col-6 col-lg-2"><label for="fPay" class="form-label small mb-1">Payment</label><select id="fPay" class="form-select"></select></div>
        <div class="col-6 col-lg-2"><label for="fFrom" class="form-label small mb-1">From</label><input id="fFrom" type="date" class="form-control"></div>
        <div class="col-6 col-lg-2"><label for="fTo" class="form-label small mb-1">To</label><input id="fTo" type="date" class="form-control"></div>
        <div class="col-6 col-lg-2"><button class="btn btn-outline-gold w-100" id="btnReset" type="button"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset</button></div>
      </div>
    </section>

    <!-- Orders table -->
    <section class="bf-card p-3 p-md-4 fade-up" aria-label="Orders table">
      <div class="small text-muted mb-2" id="ordInfo"></div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th class="sortable" data-sort="id">Order <i class="bi bi-arrow-down-up"></i></th>
              <th class="sortable" data-sort="customer">Customer <i class="bi bi-arrow-down-up"></i></th>
              <th class="sortable d-none d-md-table-cell" data-sort="date">Date <i class="bi bi-arrow-down-up"></i></th>
              <th class="sortable d-none d-lg-table-cell text-center" data-sort="units">Items <i class="bi bi-arrow-down-up"></i></th>
              <th class="sortable text-end" data-sort="total">Total <i class="bi bi-arrow-down-up"></i></th>
              <th class="d-none d-lg-table-cell">Payment</th>
              <th class="sortable" data-sort="status">Status <i class="bi bi-arrow-down-up"></i></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="ordBody"></tbody>
        </table>
      </div>
      <div id="ordEmpty"></div>
      <nav class="mt-3 d-flex justify-content-center" aria-label="Pagination"><ul class="pagination mb-0" id="pager"></ul></nav>
    </section>
  </main>

  <!-- Order details modal -->
  <div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="omTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content" style="border-radius:18px">
        <div class="modal-header border-0"><h2 class="modal-title h5" id="omTitle">Order</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body" id="omBody"></div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-outline-gold rounded-pill" id="btnPrint"><i class="bi bi-printer me-1"></i>Print</button>
          <button type="button" class="btn btn-gold rounded-pill" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/charts-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
